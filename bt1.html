<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thẻ thành viên</title>

    <!-- Bootstrap 5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Đăng ký thẻ thành viên</h1>

        <form id="registerForm" novalidate>

            <div class="mb-4">
                <label for="fullname" class="form-label">Họ và tên</label>
                <input type="text" class="form-control" id="fullname">

                <div class="invalid-feedback">
                    Họ tên không được để trống và phải có ít nhất 3 ký tự.
                </div>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email">

                <div class="invalid-feedback">
                    Email không đúng định dạng.
                </div>
            </div>

            <div class="mb-4">
                <label for="phone" class="form-label">Số điện thoại</label>
                <input type="text" class="form-control" id="phone">

                <div class="invalid-feedback">
                    Số điện thoại phải gồm đúng 10 chữ số và bắt đầu bằng số 0.
                </div>
            </div>

            <div class="mb-4">
                <label for="guests" class="form-label">
                    Số khách thường đi cùng
                </label>

                <input type="number" class="form-control" id="guests">

                <div class="invalid-feedback">
                    Số khách phải là số nguyên từ 0 đến 20.
                </div>
            </div>

            <button type="submit" class="btn btn-register">
                Đăng ký
            </button>

        </form>

        <div id="successMessage" class="alert alert-success mt-4"
             style="display: none;">
        </div>
    </div>

    <script>
        const form = document.getElementById("registerForm");

        const fullname = document.getElementById("fullname");
        const email = document.getElementById("email");
        const phone = document.getElementById("phone");
        const guests = document.getElementById("guests");

        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const nameValue = fullname.value.trim();
            const emailValue = email.value.trim();
            const phoneValue = phone.value.trim();
            const guestsValue = guests.value.trim();

            let isValid = true;successMessage.style.display = "none";

            const inputs = [fullname, email, phone, guests];

            inputs.forEach(function(input) {
                input.classList.remove("is-invalid", "is-valid");
            });

            // Kiểm tra họ tên
            if (nameValue.length < 3) {
                fullname.classList.add("is-invalid");
                isValid = false;
            } else {
                fullname.classList.add("is-valid");
            }

            // Kiểm tra email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

            if (!emailRegex.test(emailValue)) {
                email.classList.add("is-invalid");
                isValid = false;
            } else {
                email.classList.add("is-valid");
            }

            // Kiểm tra số điện thoại
            const phoneRegex = /^0\d{9}$/;

            if (!phoneRegex.test(phoneValue)) {
                phone.classList.add("is-invalid");
                isValid = false;
            } else {
                phone.classList.add("is-valid");
            }

            // Kiểm tra số khách
            const guestsNumber = Number(guestsValue);

            if (
                guestsValue === "" ||
                !Number.isInteger(guestsNumber) ||
                guestsNumber < 0 ||
                guestsNumber > 20
            ) {
                guests.classList.add("is-invalid");
                isValid = false;
            } else {
                guests.classList.add("is-valid");
            }

            // Nếu tất cả hợp lệ
            if (isValid) {

                successMessage.textContent =
                    "Cảm ơn " + nameValue +
                    " đã đăng ký thẻ thành viên Món Nghệ!";

                successMessage.style.display = "block";

                form.reset();

                inputs.forEach(function(input) {
                    input.classList.remove("is-valid");
                });
            }

        });
    </script>

</body>
</html>
